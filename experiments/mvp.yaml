# yaml-language-server: $schema=./schema.json
schemaVersion: 2
id: mvp-en-ru-author-v3
dataset: mmlu-prox-lite
protocol: mmluprox-lite-5shot-author-api-v3
languages: [en, ru]
repeats: 3
seed: 20260906
models:
  - transport: openai
    model: gpt-6-astra
    efforts: [low, medium, high]
    # Author cap. Hidden API reasoning also consumes this budget.
    maxOutputTokens: 2048
    pricing:
      asOf: 2026-09-06
      source: https://developers.openai.com/api/docs/pricing
      inputPerMillion: 10
      cachedInputPerMillion: 1
      cacheWritePerMillion: 12.5
      cacheWrite1hPerMillion: 12.5
      outputPerMillion: 50
  - transport: anthropic
    model: claude-fable-5-1
    efforts: [low, medium, high]
    maxOutputTokens: 2048
    pricing:
      asOf: 2026-09-06
      source: https://platform.claude.com/docs/en/models/fable-5-1/overview
      inputPerMillion: 10
      cachedInputPerMillion: 0.25
      cacheWritePerMillion: 12.5
      cacheWrite1hPerMillion: 20
      outputPerMillion: 50
execution:
  concurrency: 2
  maxAttempts: 3
  timeoutMs: 600000
